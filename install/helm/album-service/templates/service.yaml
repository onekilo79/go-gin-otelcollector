apiVersion: v1
kind: Service
metadata:
  name: {{ include "album-service.fullname" . }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    {{- include "album-service.labels" . | nindent 4 }}
spec:
  internalTrafficPolicy: Cluster
  type: {{ .Values.service.type }}
  sessionAffinity: None
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "album-service.selectorLabels" . | nindent 4 }}