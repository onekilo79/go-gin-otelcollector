{{- if .Values.istio.enabled }}
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: {{ include "album-service.fullname" . }}-virtual-service
  namespace: {{.Release.Namespace}}
spec:
  hosts:
    - "{{.Values.istio.host}}"
  gateways:
    - {{ include "album-service.fullname" . }}-gateway
  http:
    - route:
        - destination:
            host: album-service
            port:
              number: {{.Values.istio.portNumber}}
{{- end }}