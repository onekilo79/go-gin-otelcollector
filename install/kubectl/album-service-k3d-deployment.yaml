apiVersion: v1
kind: List
items:
  - apiVersion: v1
    kind: Service
    metadata:
      namespace: "album-service"
      name: "album-service"
      annotations:
        prometheus.io/probe: "true"
        prometheus.io/probe-path: /status
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "9080"
      labels:
        app.kubernetes.io/instance: "album-service"
        app.kubernetes.io/name: "album-service"
        app.kubernetes.io/version: "0.1.0"
    spec:
      internalTrafficPolicy: Cluster
      ipFamilies:
        - IPv4
      ipFamilyPolicy: SingleStack
      ports:
        - protocol: TCP
          name: http
          port: 9080
          targetPort: 9080
      selector:
        app.kubernetes.io/instance: "album-service"
        app.kubernetes.io/name: "album-service"
        app.kubernetes.io/version: "0.1.0"
      sessionAffinity: None
      type: ClusterIP
---
apiVersion: v1
kind: List
items:
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      labels:
        app.kubernetes.io/name: "album-service"
        app.kubernetes.io/instance: "album-service"
        app.kubernetes.io/version: "0.1.0"
      name: "album-service"
      namespace: "album-service"
    spec:
      replicas: 3
      selector:
        matchLabels:
          app.kubernetes.io/component: "album-service"
          app.kubernetes.io/instance: "album-service"
          app.kubernetes.io/name: "album-service"
          app.kubernetes.io/version: "0.1.0"
      strategy:
        rollingUpdate:
          maxSurge: 0
          maxUnavailable: 1
        type: RollingUpdate
      template:
        metadata:
          labels:
            app.kubernetes.io/component: "album-service"
            app.kubernetes.io/instance: "album-service"
            app.kubernetes.io/name: "album-service"
            app.kubernetes.io/version: "0.1.0"
        spec:
          containers:
            - name: "album-service"
              image: registry.local:54094/album-service:0.2.2 # use the cluster internal name to reference registry
              imagePullPolicy: Always
              env:
                - name: INSTANCE_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.name
                - name: NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
                - name: OTEL_LOCATION
                  value: "opentelemetry-collector.observability.svc.cluster.local:4317"
                - name: GRPC_GO_LOG_VERBOSITY_LEVEL
                  value: "99"
                - name: GRPC_GO_LOG_SEVERITY_LEVEL
                  value: "info"
              ports:
                - name: http
                  containerPort: 9080
                  protocol: TCP
              resources:
                requests:
                  memory: "64Mi"
                  cpu: "250m"
                limits:
                  memory: "128Mi"
                  cpu: "500m"
              livenessProbe:
                httpGet:
                  path: /status
                  port: http
                initialDelaySeconds: 1
                periodSeconds: 5
          dnsPolicy: ClusterFirst # must be `ClusterFirst` to allow nginx to route to it via the ingress
          restartPolicy: Always
          terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: List
items:
  - apiVersion: networking.istio.io/v1beta1
    kind: VirtualService
    metadata:
      name: album-service-virtual-service
      namespace: album-service
    spec:
      gateways:
        - album-service-gateway
      hosts:
        - album-service.local
      http:
        - route:
            - destination:
                host: album-service
                port:
                  number: 9080
---
apiVersion: v1
kind: List
items:
  - apiVersion: networking.istio.io/v1beta1
    kind: Gateway
    metadata:
      name: album-service-gateway
      namespace: album-service
    spec:
      selector:
        istio: ingressgateway
      servers:
        - hosts:
            - album-service.local
          port:
            name: http-album-service
            number: 80
            protocol: HTTP
---
apiVersion: v1
kind: List
items:
  - apiVersion: networking.istio.io/v1beta1
    kind: DestinationRule
    metadata:
      name: album-service-destination-rule
      namespace: album-service
    spec:
      host: album-service
      trafficPolicy:
        tls:
          mode: DISABLE
---
apiVersion: v1
kind: List
items:
  - apiVersion: autoscaling/v2
    kind: HorizontalPodAutoscaler
    metadata:
      name: album-service
      namespace: album-service
      labels:
        app.kubernetes.io/instance: album-service
        app.kubernetes.io/name: album-service
        app.kubernetes.io/version: 0.2.2
    spec:
      maxReplicas: 5
      metrics:
        - resource:
            name: cpu
            target:
              averageUtilization: 80
              type: Utilization
          type: Resource
      minReplicas: 1
      scaleTargetRef:
        apiVersion: apps/v1
        kind: Deployment
        name: album-service